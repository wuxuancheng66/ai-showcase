# Agent 生态评分卡（透明可编辑）
# 综合分 = 各维度加权平均。有争议直接改 dims 数字，保存即生效（config 已只读挂载进容器）。
# 证据基准：以本机实际可验证能力为准（本会话即 ZCode 能力的直接证据）。

rubric:
  技能与插件生态: 0.25      # 内置/第三方技能、插件、扩展市场
  电脑与终端操作: 0.20      # 桌面操控、浏览器控制、终端执行
  自动化与定时任务: 0.15    # 定时任务、目标驱动、后台长任务
  MCP与外部工具: 0.15       # MCP 客户端/服务端、外部系统集成
  多模型灵活性: 0.15        # 可接入模型的广度（不锁定单一厂商）
  可编程扩展接口: 0.10      # hooks、rules、SDK、API、子代理

agents:
  - id: openclaw
    dims: {技能与插件生态: 88, 电脑与终端操作: 95, 自动化与定时任务: 85, MCP与外部工具: 88, 多模型灵活性: 90, 可编程扩展接口: 85}
    evidence: "exec+浏览器+技能+插件+多渠道接入；生态年轻但扩张快"

  - id: zcode
    dims: {技能与插件生态: 92, 电脑与终端操作: 95, 自动化与定时任务: 92, MCP与外部工具: 90, 多模型灵活性: 75, 可编程扩展接口: 92}
    evidence: "技能系统+computer-use+browser-use+hooks+MCP+automations+rules+子代理全内置（本会话即验证）；主要短板是多模型接入偏自有生态"

  - id: claude-code
    dims: {技能与插件生态: 90, 电脑与终端操作: 92, 自动化与定时任务: 70, MCP与外部工具: 90, 多模型灵活性: 70, 可编程扩展接口: 88}
    evidence: "Skills+hooks+MCP+subagent 成熟；原生锁定 Claude 系模型"

  - id: vscode-claude
    dims: {技能与插件生态: 95, 电脑与终端操作: 72, 自动化与定时任务: 62, MCP与外部工具: 86, 多模型灵活性: 68, 可编程扩展接口: 85}
    evidence: "继承 VS Code 海量插件市场；agent 自主性与桌面/浏览器操控弱于独立 CLI"

  - id: chatgpt
    dims: {技能与插件生态: 88, 电脑与终端操作: 68, 自动化与定时任务: 74, MCP与外部工具: 66, 多模型灵活性: 25, 可编程扩展接口: 72}
    evidence: "最强对话型 AI 产品：GPTs 生态庞大；『应用快照/Work with Apps』可感知已打开的应用窗口，系统级集成独一无二。但作为可部署 agent 空壳是封闭的——模型锁定 OpenAI 系（无法部署免费模型）、无终端自主执行；应用快照为读屏感知而非自主操作"

  - id: codex
    dims: {技能与插件生态: 78, 电脑与终端操作: 90, 自动化与定时任务: 68, MCP与外部工具: 80, 多模型灵活性: 58, 可编程扩展接口: 75}
    evidence: "终端能力强；生态绑定 OpenAI 系，扩展接口较封闭"

  - id: cursor
    dims: {技能与插件生态: 95, 电脑与终端操作: 72, 自动化与定时任务: 68, MCP与外部工具: 85, 多模型灵活性: 82, 可编程扩展接口: 78}
    evidence: "VS Code 底座插件市场+多模型可选；agent 自主运行能力中等"

  - id: hermes
    dims: {技能与插件生态: 70, 电脑与终端操作: 85, 自动化与定时任务: 72, MCP与外部工具: 70, 多模型灵活性: 80, 可编程扩展接口: 70}
    evidence: "本地终端 agent 灵活；第三方生态规模待增长"

  - id: autoclaw
    dims: {技能与插件生态: 82, 电脑与终端操作: 88, 自动化与定时任务: 78, MCP与外部工具: 75, 多模型灵活性: 55, 可编程扩展接口: 70}
    evidence: "OpenClaw 同源架构，GLM 生态深度绑定"

  - id: dsh
    dims: {技能与插件生态: 68, 电脑与终端操作: 65, 自动化与定时任务: 70, MCP与外部工具: 60, 多模型灵活性: 40, 可编程扩展接口: 65}
    evidence: "DeepSeek 专用 Harness，经济模式独特但生态封闭"

  - id: workbuddy
    dims: {技能与插件生态: 60, 电脑与终端操作: 62, 自动化与定时任务: 60, MCP与外部工具: 58, 多模型灵活性: 60, 可编程扩展接口: 55}
    evidence: "面向职场场景的整合 agent，开放生态资料有限（评分置信度低）"

  - id: agent-team
    dims: {技能与插件生态: 62, 电脑与终端操作: 70, 自动化与定时任务: 75, MCP与外部工具: 60, 多模型灵活性: 65, 可编程扩展接口: 62}
    evidence: "本地多 agent 编排器，偏自用"

  - id: lm-studio
    dims: {技能与插件生态: 55, 电脑与终端操作: 30, 自动化与定时任务: 40, MCP与外部工具: 55, 多模型灵活性: 90, 可编程扩展接口: 60}
    evidence: "本地模型运行器：模型灵活度满分，但非操作型 agent"
