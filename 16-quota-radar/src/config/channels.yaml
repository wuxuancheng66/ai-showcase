# 免费额度渠道注册表（种子）。status 一律从 unknown 起步，只有探活验证后才变为 ok/limited/error。
# probe:
#   type: openai_compatible → 用 OpenAI 兼容 /chat/completions 发最小请求（max_tokens=1）
#   type: google_list       → Google Generative Language API 列模型（免费额度验证）
#   type: none              → 仅页面监控/人工核验，不做自动探测
# env_key 对应 .env 中的变量名；未配置 key → 永远显示"未验证"，绝不假装可用。
#
# ---- 免费渠道综合排行种子属性（free_rank）----
# access_cn: 国内网络直连可达性 0-100（是否需要代理/速度）
# limits: 限速宽松度 0-100（次数/频率越宽松越高）
# stability_seed: 供应商成熟度 0-100（与探活状态相乘得最终稳定性）
# models_offered: 该渠道免费可用的代表模型（id + 能力种子分，可手调）
# configured_in_agent: 已部署进本机 agent（如 OpenClaw）——强上手加分

channels:
  - id: nvidia-nim
    name: NVIDIA NIM 试用额度
    provider: nvidia
    tier: free
    url: https://build.nvidia.com
    kind: api
    requires_key: true
    env_key: NVIDIA_API_KEY
    probe: { type: openai_compatible, base_url: "https://integrate.api.nvidia.com/v1", model: "meta/llama-3.3-70b-instruct" }
    free_tier_desc: "注册送 1000 credits 试用各系列模型"
    access_cn: 70
    limits: 75
    stability_seed: 90
    configured_in_agent: true
    models_offered:
      - { id: "nemotron-3-ultra-550b-a55b", capability: 93 }
      - { id: "moonshotai/kimi-k2.5", capability: 90 }
      - { id: "z-ai/glm-5.1", capability: 88 }
      - { id: "minimaxai/minimax-m2.7", capability: 87 }
      - { id: "nemotron-3-super-120b-a12b", capability: 84 }

