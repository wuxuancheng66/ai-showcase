# agent 空壳注册表：雷达可一键部署的目标 agent。
# 一期只启 OpenClaw（生态完善、自带 exec/浏览器/技能、权限模型清晰）；
# 其他 agent（Cherry Studio 等）按同样结构扩展即可。

agents:
  - id: openclaw
    name: OpenClaw
    kind: gateway-agent          # 常驻网关型个人 agent
    cli: openclaw
    config_path: ~/.openclaw/openclaw.json
    gateway_url: http://localhost:18790   # 18789 归 AutoClaw/GLM，18790 为 OpenClaw/NVIDIA 独享
    capabilities:
      - exec            # 终端命令（带审批机制）
      - browser         # 浏览器控制
      - skills          # 内置技能生态
      - computer        # 桌面操作
    install_cmd: "npm install -g openclaw@latest"
    # 部署方式：config patch（带校验写入）→ gateway restart → infer 验证
    deploy:
      requires_allowlist: true      # 新模型必须加进 modelPolicy.allow
      auth_style: auth_profiles     # 密钥走 auth 存储（与本机 nvidia 一致）
    enabled: true
