<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordVault · 我的单词本</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#6366f1;--primary-dark:#4f46e5;--primary-light:#eef2ff;
  --success:#10b981;--warning:#f59e0b;--danger:#ef4444;--star:#f59e0b;
  --bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#1e293b;--text-muted:#64748b;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:768px;margin:0 auto;padding:16px}
header{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:24px 16px;text-align:center;border-radius:0 0 24px 24px;margin-bottom:20px}
header h1{font-size:28px;font-weight:700;margin-bottom:4px}
header p{opacity:.9;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 8px;text-align:center}
.stat .num{font-size:22px;font-weight:700;color:var(--primary)}
.stat .label{font-size:12px;color:var(--text-muted);margin-top:2px}
.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.search-box{position:relative}
.search-box input{width:100%;padding:12px 16px 12px 42px;border:1px solid var(--border);border-radius:12px;font-size:15px;outline:none;transition:border .2s}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:18px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);cursor:pointer;outline:none}
.actions{display:flex;gap:8px;margin-bottom:16px}
.btn{padding:10px 16px;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:var(--card);color:var(--primary);border:1px solid var(--primary)}
.btn-outline:hover{background:var(--primary-light)}
.word-list{display:flex;flex-direction:column;gap:10px}
.word-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:all .2s}
.word-card:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(99,102,241,.08)}
.word-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.word-main{flex:1;min-width:0}
.word-text{font-size:20px;font-weight:700;color:var(--primary-dark);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.word-phonetic{color:var(--text-muted);font-size:14px;font-style:italic}
.word-meaning{color:var(--text);margin-top:6px;font-size:15px;line-height:1.5}
.word-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.badge{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge-cat{background:var(--primary-light);color:var(--primary-dark)}
.mastery{display:flex;gap:3px}
.mastery-dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1}
.mastery-dot.active{background:var(--primary)}
.star{font-size:20px;cursor:pointer;color:#cbd5e1;background:none;border:none;line-height:1}
.star.active{color:var(--star)}
.word-actions{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.word-actions .btn{padding:6px 12px;font-size:13px}
.btn-detail{background:var(--primary-light);color:var(--primary-dark)}
.btn-detail:hover{background:#c7d2fe}
.btn-edit{background:#f1f5f9;color:var(--text)}
.btn-delete{background:#fef2f2;color:var(--danger)}
.empty{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-icon{font-size:48px;margin-bottom:12px}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:20px;margin-bottom:16px;color:var(--text)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary)}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
/* Detail page */
.detail-header{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:20px 16px;border-radius:0 0 20px 20px;margin-bottom:16px}
.detail-back{display:inline-flex;align-items:center;gap:6px;color:#fff;background:rgba(255,255,255,.2);border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:14px}
.detail-back:hover{background:rgba(255,255,255,.3)}
.detail-word{font-size:32px;font-weight:700}
.detail-phonetic{opacity:.9;font-size:16px;margin-top:4px}
.detail-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.detail-section h3{font-size:15px;color:var(--primary-dark);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.def-item{padding:8px 0;border-bottom:1px solid #f1f5f9}
.def-item:last-child{border-bottom:none}
.def-pos{display:inline-block;background:var(--primary-light);color:var(--primary-dark);padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;margin-right:8px}
.def-text{font-size:15px;line-height:1.6}
.freq{float:right;color:var(--star);font-size:12px}
.example-item{background:#f8fafc;border-left:3px solid var(--primary);padding:10px 14px;margin-bottom:8px;border-radius:0 8px 8px 0}
.example-en{font-size:14px;line-height:1.6;color:var(--text)}
.example-zh{font-size:13px;color:var(--text-muted);margin-top:4px}
.example-source{font-size:11px;color:var(--primary);font-weight:600;margin-right:6px}
.word-tag{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;margin:3px;cursor:pointer}
.tag-syn{background:#ecfdf5;color:#059669}
.tag-ant{background:#fef2f2;color:#dc2626}
.tag-rel{background:#f0f9ff;color:#0284c7}
.tag-der{background:#fef3c7;color:#b45309}
.tag-col{background:#f5f3ff;color:#7c3aed}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;transition:transform .3s;z-index:200}
.toast.show{transform:translateX(-50%) translateY(0)}
.hidden{display:none}
@media(max-width:600px){
  .stats{grid-template-columns:repeat(2,1fr)}
  header h1{font-size:24px}
  .detail-word{font-size:26px}
}
</style>

<style id="accessibility-refinement">
:focus-visible{outline:3px solid #087ce5!important;outline-offset:4px}
button,input,select,textarea{font:inherit}button,a,input,select,textarea{touch-action:manipulation}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto!important}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;animation-iteration-count:1!important}}
@media(max-width:600px){table{display:block;max-width:100%;overflow-x:auto}input,select,textarea{font-size:16px!important}}
</style>
<style>
header{background:#fff;color:var(--text);border-bottom:1px solid var(--border);border-radius:0;padding:28px 16px}
header h1{font-size:25px;letter-spacing:-.5px}.storage-notice{color:#9a4b0a;background:#fff7ed;padding:10px;border-radius:10px;margin:12px auto 0;max-width:700px}
.storage-notice:empty{display:none}.word-card:focus-visible{outline-offset:2px}.word-text{overflow-wrap:anywhere}.word-main{min-width:0}.word-meta{flex-shrink:0}
.modal{max-height:85dvh;overflow:auto}.word-actions .btn,.star{min-height:38px}.actions{flex-wrap:wrap}
@media(max-width:480px){.word-header{gap:8px}.word-text{font-size:20px}.word-meta{flex-direction:column;align-items:flex-end}.filters{display:grid;grid-template-columns:1fr 1fr}.filters select{min-width:0}.filters select:last-child{grid-column:1/-1}.stats{gap:6px}.stat .num{font-size:23px}.word-actions{flex-wrap:wrap}.word-card{padding:14px}.actions .btn{flex:1 1 44%}}
</style></head>

// 本地存储（localStorage 持久化）
const STORAGE_KEY = 'wordvault_data_v1';

let storageNotice = '';
function initialData() {
  return {words: EMBEDDED_DATA.words.map(w => ({...w})), details: JSON.parse(JSON.stringify(EMBEDDED_DATA.details)), nextId: Math.max(0,...EMBEDDED_DATA.words.map(w => w.id)) + 1};
}
function normalizeData(value) {
  const source = Array.isArray(value) ? {words:value,details:{}} : value;
  if (!source || !Array.isArray(source.words) || source.words.length > 20000) throw new Error('文件需要包含 words 数组（最多 20000 词）');
  const used = new Set();
  const words = source.words.map((w,i) => {
    if (!w || typeof w.word !== 'string' || !w.word.trim() || typeof w.meaning !== 'string' || !w.meaning.trim()) throw new Error('第 '+(i+1)+' 项需要单词和释义');
    let id = Number(w.id);
    if (!Number.isSafeInteger(id) || id < 1 || id > 1000000000 || used.has(id)) id = i + 1;
    while(used.has(id)) id++;
    used.add(id);
    const str = x => typeof x === 'string' ? x.slice(0,20000) : '';
    return {...w, id, word:w.word.trim().slice(0,300), meaning:w.meaning.trim().slice(0,20000), phonetic:str(w.phonetic), example:str(w.example), category:str(w.category)||'daily', mastery:Math.min(3,Math.max(0,Math.trunc(Number(w.mastery)||0))), is_favorite:w.is_favorite===true, created_at:Number.isFinite(Date.parse(w.created_at))?w.created_at:new Date().toISOString()};
  });
  const details = source.details && typeof source.details === 'object' && !Array.isArray(source.details) ? source.details : {};
  for(const item of Object.values(details)){
    if(!item||typeof item!=='object'||Array.isArray(item))throw new Error('词条详情格式不正确');
    for(const key of ['definitions','derivatives','collocations','examples'])if(item[key]!==undefined&&(!Array.isArray(item[key])||item[key].some(x=>!x||typeof x!=='object'||Array.isArray(x))))throw new Error('词条 '+key+' 需要对象数组');
    if(item.related_words){if(typeof item.related_words!=='object'||Array.isArray(item.related_words))throw new Error('关联词格式不正确');for(const key of ['synonyms','antonyms','related'])if(item.related_words[key]!==undefined&&(!Array.isArray(item.related_words[key])||!item.related_words[key].every(x=>typeof x==='string')))throw new Error('关联词需要文字数组');}
  }
  return {words, details, nextId:Math.max(0,...words.map(w=>w.id)) + 1};
}
function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return normalizeData(JSON.parse(saved));
  } catch(e) { storageNotice = '浏览器中的记录暂时无法读取。原存储尚未覆盖；请先导出当前词库，或换用正常浏览器窗口。'; }
  return initialData();
}
function escapeHTML(value) { return String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function displayData(value) {
  if (typeof value === 'string') return escapeHTML(value);
  if (Array.isArray(value)) return value.map(displayData);
  if (value && typeof value === 'object') return Object.fromEntries(Object.entries(value).filter(([k])=>!['__proto__','constructor','prototype'].includes(k)).map(([k,v])=>[k,displayData(v)]));
  return value;
}

let data = loadData();
let currentView = 'home';
let currentDetailId = null;
let searchTerm = '';
let filterCategory = 'all';
let filterMastery = 'all';
let filterFavorite = false;

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); storageNotice = ''; return true; }
  catch(e) { storageNotice = '这次修改只保留在当前页面。浏览器存储不可用或空间不足，请点“导出备份”后再关闭页面。'; return false; }
}

const CATEGORIES = {GRE:'GRE',TOEFL:'TOEFL',CET4:'CET-4',CET6:'CET-6',IELTS:'IELTS',daily:'日常',academic:'学术',business:'商务'};
const MASTERY_NAMES = ['新词','认识','熟悉','掌握'];
const MASTERY_COLORS = ['#94a3b8','#3b82f6','#8b5cf6','#10b981'];

function getStats() {
  const words = data.words;
  const today = new Date().toDateString();
  return {
    total: words.length,
    today: words.filter(w => new Date(w.created_at).toDateString() === today).length,
    favorites: words.filter(w => w.is_favorite).length,
    mastered: words.filter(w => w.mastery === 3).length,
  };
}

function getFilteredWords() {
  const query=searchTerm.trim().toLocaleLowerCase();
  return data.words.filter(w => {
    if (query && !w.word.toLocaleLowerCase().includes(query) && !(w.meaning||'').toLocaleLowerCase().includes(query)) return false;
    if (filterCategory !== 'all' && w.category !== filterCategory) return false;
    if (filterMastery !== 'all' && w.mastery !== parseInt(filterMastery)) return false;
    if (filterFavorite && !w.is_favorite) return false;
    return true;
  }).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
}

function renderHome() {
  const stats = getStats();
  const filtered = getFilteredWords().map(displayData);
  const masteryRate = stats.total ? Math.round(stats.mastered / stats.total * 100) : 0;

  document.getElementById('app').innerHTML = `
    <header>
      <h1>📚 WordVault</h1>
      <p>我的英语单词本 · 共 ${stats.total} 词</p><p class="storage-notice" role="status">${escapeHTML(storageNotice)}</p>
    </header>
    <div class="container">
      <div class="stats">
        <div class="stat"><div class="num">${stats.total}</div><div class="label">总单词</div></div>
        <div class="stat"><div class="num">${stats.today}</div><div class="label">今日新增</div></div>
        <div class="stat"><div class="num">${stats.favorites}</div><div class="label">收藏</div></div>
        <div class="stat"><div class="num">${masteryRate}%</div><div class="label">掌握率</div></div>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" aria-label="搜索单词或释义" placeholder="搜索单词或释义..." value="${escapeHTML(searchTerm)}">
        </div>
        <div class="filters">
          <select id="filterCategory" aria-label="分类筛选">
            <option value="all">全部分类</option>
            ${Object.entries(CATEGORIES).map(([k,v]) => `<option value="${k}" ${filterCategory===k?'selected':''}>${v}</option>`).join('')}
          </select>
          <select id="filterMastery" aria-label="掌握度筛选">
            <option value="all">全部掌握度</option>
            ${MASTERY_NAMES.map((n,i) => `<option value="${i}" ${filterMastery==String(i)?'selected':''}>${n}</option>`).join('')}
          </select>
          <select id="filterFavorite" aria-label="收藏筛选">
            <option value="all">全部</option>
            <option value="fav" ${filterFavorite?'selected':''}>仅收藏</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" onclick="showAddModal()">＋ 添加单词</button>
        <button class="btn btn-outline" onclick="exportData()">导出备份</button><button class="btn btn-outline" onclick="document.getElementById('importFile').click()">导入词库</button><button class="btn btn-outline" onclick="resetData()">恢复初始词库</button>
      </div>

      <div class="word-list">
        ${filtered.length === 0 ? `
          <div class="empty">
            <div class="empty-icon">📖</div>
            <p>没有找到匹配的单词</p>
          </div>
        ` : filtered.map(w => `
          <div class="word-card" tabindex="0" role="group" aria-label="${w.word}，${w.meaning}" onkeydown="if(event.target===this && (event.key==='Enter'||event.key===' ')){event.preventDefault();showDetail(${w.id})}" onclick="showDetail(${w.id})">
            <div class="word-header">
              <div class="word-main">
                <div class="word-text">
                  ${w.word}
                  ${w.phonetic ? `<span class="word-phonetic">${w.phonetic}</span>` : ''}
                </div>
                <div class="word-meaning">${w.meaning}</div>
              </div>
              <div class="word-meta">
                <button aria-label="${w.is_favorite?'取消收藏':'收藏'} ${w.word}" aria-pressed="${w.is_favorite}" class="star ${w.is_favorite?'active':''}" onclick="event.stopPropagation();toggleFavorite(${w.id})">${w.is_favorite?'★':'☆'}</button>
                <span class="badge badge-cat">${CATEGORIES[w.category]||w.category||'未分类'}</span>
              </div>
            </div>
            <div class="word-actions" onclick="event.stopPropagation()">
              <button class="btn btn-detail" onclick="showDetail(${w.id})">📖 查看详情</button>
              <button class="btn btn-edit" onclick="cycleMastery(${w.id})">
                <span class="mastery-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${MASTERY_COLORS[w.mastery]}"></span>
                ${MASTERY_NAMES[w.mastery]}
              </button>
              <button class="btn btn-edit" onclick="showEditModal(${w.id})">✏️ 编辑</button>
              <button class="btn btn-delete" aria-label="删除 ${w.word}" onclick="deleteWord(${w.id})">🗑️</button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  const searchInput = document.getElementById('searchInput');
  function updateSearch(e) {
    if(e.isComposing) return;
    const start=e.target.selectionStart,end=e.target.selectionEnd;
    searchTerm=e.target.value; renderHome();
    const next=document.getElementById('searchInput'); next.focus(); next.setSelectionRange(start,end);
  }
  searchInput.addEventListener('input',updateSearch);
  searchInput.addEventListener('compositionend',updateSearch);
  document.getElementById('filterCategory').addEventListener('change', e => { filterCategory = e.target.value; renderHome(); });
  document.getElementById('filterMastery').addEventListener('change', e => { filterMastery = e.target.value; renderHome(); });
  document.getElementById('filterFavorite').addEventListener('change', e => { filterFavorite = e.target.value === 'fav'; renderHome(); });

}

function renderDetail() {
  const word = displayData(data.words.find(w => w.id === currentDetailId));
  if (!word) { renderHome(); return; }
  const detail = displayData(data.details[word.id]);

  let html = `
    <div class="detail-header">
      <button class="detail-back" onclick="goHome()">← 返回单词本</button>
      <div class="detail-word">${word.word}</div>
      <div class="detail-phonetic">
        ${detail?.phonetic_uk ? '英 '+detail.phonetic_uk : (word.phonetic||'')}
        ${detail?.phonetic_us ? ' · 美 '+detail.phonetic_us : ''}
      </div>
    </div>
    <div class="container"><p class="storage-notice" role="status">${escapeHTML(storageNotice)}</p>
  `;

  // 释义
  const defs = detail?.definitions?.length ? detail.definitions : [{pos:'',meaning:word.meaning,frequency:5}];
  html += `
    <div class="detail-section">
      <h3>📝 释义</h3>
      ${defs.map(d => `
        <div class="def-item">
          ${d.pos ? `<span class="def-pos">${d.pos}</span>` : ''}
          <span class="def-text">${d.meaning}</span>
          ${d.frequency ? `<span class="freq">${'★'.repeat(Math.min(5,Math.max(0,Number(d.frequency)||0)))}</span>` : ''}
        </div>
      `).join('')}
    </div>
  `;

  // 时态变化
  if (detail?.conjugations) {
    const c = detail.conjugations;
    const items = [];
    if (c.present) items.push(`现在式: <b>${c.present}</b>`);
    if (c.past) items.push(`过去式: <b>${c.past}</b>`);
    if (c.pastParticiple) items.push(`过去分词: <b>${c.pastParticiple}</b>`);
    if (c.presentParticiple) items.push(`现在分词: <b>${c.presentParticiple}</b>`);
    if (c.thirdPerson) items.push(`第三人称: <b>${c.thirdPerson}</b>`);
    if (items.length) {
      html += `<div class="detail-section"><h3>🔄 时态变化</h3><div style="line-height:2;font-size:14px">${items.join(' &nbsp;|&nbsp; ')}</div></div>`;
    }
  }

  // 词性变化（派生词）
  if (detail?.derivatives?.length) {
    html += `
      <div class="detail-section">
        <h3>🔀 词性变化</h3>
        <div>${detail.derivatives.map(d => `<span class="word-tag tag-der">${d.pos} ${d.word} <small style="opacity:.7">${d.meaning}</small></span>`).join('')}</div>
      </div>
    `;
  }

  // 近义/反义/联想词
  if (detail?.related_words) {
    const r = detail.related_words;
    let relHtml = '';
    if (r.synonyms?.length) relHtml += `<div style="margin-bottom:8px"><b style="color:#059669">近义词：</b>${r.synonyms.map(w=>`<span class="word-tag tag-syn">${w}</span>`).join('')}</div>`;
    if (r.antonyms?.length) relHtml += `<div style="margin-bottom:8px"><b style="color:#dc2626">反义词：</b>${r.antonyms.map(w=>`<span class="word-tag tag-ant">${w}</span>`).join('')}</div>`;
    if (r.related?.length) relHtml += `<div><b style="color:#0284c7">联想词：</b>${r.related.map(w=>`<span class="word-tag tag-rel">${w}</span>`).join('')}</div>`;
    if (relHtml) html += `<div class="detail-section"><h3>🔗 词汇关联</h3>${relHtml}</div>`;
  }

  // 常用短语
  if (detail?.collocations?.length) {
    html += `
      <div class="detail-section">
        <h3>💬 常用短语</h3>
        ${detail.collocations.map(c => `<div style="padding:6px 0;font-size:14px"><b>${c.phrase}</b> <span style="color:var(--text-muted)">— ${c.meaning}</span></div>`).join('')}
      </div>
    `;
  }

  // 例句
  const examples = detail?.examples?.length ? detail.examples : (word.example ? [{source:'',sentence:word.example,translation:''}] : []);
  if (examples.length) {
    html += `
      <div class="detail-section">
        <h3>📚 学习例句 (${examples.length})</h3>
        ${examples.map(e => `
          <div class="example-item">
            <div class="example-en">${e.source ? `<span class="example-source">[${e.source}]</span>` : ''}${e.sentence}</div>
            ${e.translation ? `<div class="example-zh">${e.translation}</div>` : ''}
          </div>
        `).join('')}
      </div>
    `;
  }

  // 基本信息
  html += `
    <div class="detail-section">
      <h3>ℹ️ 学习信息</h3>
      <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:14px">
        <div>分类：<span class="badge badge-cat">${CATEGORIES[word.category]||word.category||'未分类'}</span></div>
        <div>掌握度：<span style="color:${MASTERY_COLORS[word.mastery]};font-weight:600">${MASTERY_NAMES[word.mastery]}</span></div>
        <div>收藏：<span style="color:var(--star)">${word.is_favorite?'★ 已收藏':'☆ 未收藏'}</span></div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="cycleMastery(${word.id});showDetail(${word.id})">切换掌握度</button>
        <button class="btn btn-outline" onclick="toggleFavorite(${word.id});showDetail(${word.id})">${word.is_favorite?'取消收藏':'收藏'}</button>
        <button class="btn btn-outline" onclick="goHome()">返回列表</button>
      </div>
    </div>
  `;

  html += '</div>';
  document.getElementById('app').innerHTML = html;
  window.scrollTo(0, 0);
}

function showDetail(id) { currentDetailId = id; currentView = 'detail'; renderDetail(); }
function goHome() { currentView = 'home'; currentDetailId = null; renderHome(); }

function showAddModal() {
  showModal(`
    <h2>添加新单词</h2>
    <div class="form-group"><label>单词 *</label><input id="mWord" placeholder="例如：serendipity"></div>
    <div class="form-row">
      <div class="form-group"><label>音标</label><input id="mPhonetic" placeholder="/ˌserənˈdɪpəti/"></div>
      <div class="form-group"><label>分类</label><select id="mCategory">${Object.entries(CATEGORIES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
    </div>
    <div class="form-group"><label>释义 *</label><textarea id="mMeaning" placeholder="中文释义"></textarea></div>
    <div class="form-group"><label>例句</label><textarea id="mExample" placeholder="英文例句（可选）"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="addWord()">添加</button>
    </div>
  `);
}

function showEditModal(id) {
  const w = displayData(data.words.find(x => x.id === id));
  if (!w) return;
  showModal(`
    <h2>编辑单词</h2>
    <div class="form-group"><label>单词 *</label><input id="mWord" value="${w.word}"></div>
    <div class="form-row">
      <div class="form-group"><label>音标</label><input id="mPhonetic" value="${w.phonetic||''}"></div>
      <div class="form-group"><label>分类</label><select id="mCategory">${Object.entries(CATEGORIES).map(([k,v])=>`<option value="${k}" ${w.category===k?'selected':''}>${v}</option>`).join('')}</select></div>
    </div>
    <div class="form-group"><label>释义 *</label><textarea id="mMeaning">${w.meaning}</textarea></div>
    <div class="form-group"><label>例句</label><textarea id="mExample">${w.example||''}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="updateWord(${id})">保存</button>
    </div>
  `);
}

let modalPreviousFocus = null;
function showModal(html) {
  modalPreviousFocus = document.activeElement;
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('modalContent').querySelectorAll('.form-group').forEach(group=>{const label=group.querySelector('label'),input=group.querySelector('input,select,textarea');if(label&&input)label.htmlFor=input.id;});
  document.getElementById('mWord')?.focus();
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); modalPreviousFocus?.focus(); }

function addWord() {
  const word = document.getElementById('mWord').value.trim();
  const meaning = document.getElementById('mMeaning').value.trim();
  if (!word || !meaning) { showToast('请填写单词和释义'); return; }
  data.words.unshift({
    id: data.nextId++,
    word, phonetic: document.getElementById('mPhonetic').value.trim(),
    meaning, example: document.getElementById('mExample').value.trim(),
    category: document.getElementById('mCategory').value,
    mastery: 0, is_favorite: false,
    created_at: new Date().toISOString(), updated_at: null
  });
  saveData();
  closeModal();
  renderHome();
  showToast('已添加：' + word);
}

function updateWord(id) {
  const w = data.words.find(x => x.id === id);
  if (!w) return;
  const updatedWord=document.getElementById('mWord').value.trim(), updatedMeaning=document.getElementById('mMeaning').value.trim();
  if(!updatedWord||!updatedMeaning){showToast('请填写单词和释义');return;}
  w.word = updatedWord;
  w.phonetic = document.getElementById('mPhonetic').value.trim();
  w.meaning = document.getElementById('mMeaning').value.trim();
  w.example = document.getElementById('mExample').value.trim();
  w.category = document.getElementById('mCategory').value;
  w.updated_at = new Date().toISOString();
  saveData();
  closeModal();
  renderHome();
  showToast('已更新');
}

function deleteWord(id) {
  if (!confirm('确定删除这个单词吗？')) return;
  data.words = data.words.filter(w => w.id !== id);
  delete data.details[id];
  saveData();
  if (currentView === 'detail') goHome(); else renderHome();
  showToast('已删除');
}

function cycleMastery(id) {
  const w = data.words.find(x => x.id === id);
  if (!w) return;
  w.mastery = (w.mastery + 1) % 4;
  w.updated_at = new Date().toISOString();
  saveData();
  if (currentView === 'home') renderHome();
  showToast(MASTERY_NAMES[w.mastery]);
}

function toggleFavorite(id) {
  const w = data.words.find(x => x.id === id);
  if (!w) return;
  w.is_favorite = !w.is_favorite;
  saveData();
  if (currentView === 'home') renderHome();
  showToast(w.is_favorite ? '已收藏 ★' : '已取消收藏');
}

function resetData() {
  if (!confirm('重置将恢复为初始数据，你添加的单词会丢失。确定吗？')) return;
  data = initialData();
  saveData();
  renderHome();
  showToast('已重置为初始数据');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// 点击遮罩关闭
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});


function exportData() {
  const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download='WordVault-'+new Date().toISOString().slice(0,10)+'.json';link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('备份已准备，请保留下载的 JSON 文件');
}
async function importDataFile(input) {
  const file=input.files?.[0];if(!file)return;
  try {
    if(file.size>10*1024*1024)throw new Error('文件超过10MB');
    const incoming=normalizeData(JSON.parse(await file.text()));
    const known=new Set(data.words.map(w=>w.word.toLocaleLowerCase()));
    const additions=[];const details={...data.details};let nextId=data.nextId;
    for(const w of incoming.words){const key=w.word.toLocaleLowerCase();if(known.has(key))continue;known.add(key);const id=nextId++;additions.push({...w,id});if(incoming.details[w.id])details[id]=incoming.details[w.id];}
    if(data.words.length+additions.length>20000)throw new Error('合并后超过20000词');
    data={words:[...additions,...data.words],details,nextId};saveData();renderHome();showToast('已导入 '+additions.length+' 词；已有单词与学习记录保留');
  } catch(e){showToast('无法导入：'+e.message);} finally{input.value='';}
}
document.addEventListener('keydown',e=>{
  const overlay=document.getElementById('modalOverlay');if(!overlay.classList.contains('show'))return;
  if(e.key==='Escape'){e.preventDefault();closeModal();}
  if(e.key==='Tab'){
    const nodes=[...document.getElementById('modalContent').querySelectorAll('input,select,textarea,button')];
    const first=nodes[0],last=nodes[nodes.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});

// 启动
renderHome();
</script>
</body>
</html>
