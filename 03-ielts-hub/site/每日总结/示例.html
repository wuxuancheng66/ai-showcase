<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习记录示例 · 雅思学习站</title><style>body{max-width:800px;margin:auto;padding:30px 20px;font:16px/1.85 system-ui,sans-serif;color:#263142;background:#f8f9fa}h1,h2{line-height:1.4}section{padding:18px 0;border-bottom:1px solid #dce1e8}a{color:#1565c0}aside{padding:16px;background:#eaf2fb}li{margin:8px 0}:focus-visible{outline:3px solid #1565c0;outline-offset:4px}</style><a href="../index.html">← 返回学习站</a><h1>学习记录示例</h1><aside>以下是虚构的填写示例，不代表任何使用者的真实成绩或学习经历。使用时可复制每日总结模板，填写自己的日期、练习和复盘。</aside><section><h2>练习内容</h2><ul><li>口语：围绕一个熟悉话题，逐题录制简短回答。</li><li>阅读：完成一组判断题，并标出支持答案的原文证据。</li></ul></section><section><h2>错因与改进</h2><ul><li>示例错因：回答偏离题目。改进：先回应问题，再补充理由和例子。</li><li>示例错因：把个人推断当作原文信息。改进：逐项核对证据，不额外推断。</li></ul></section><section><h2>下一步计划</h2><p>选择一个尚未掌握的题型，安排下一次练习；完成后记录实际结果。</p></section><p><a href="模板.html">打开可复制的每日总结模板</a></p></html>
