<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPT 自动生成器 · 吴宣澄的项目</title><style>body{font:16px/1.8 system-ui,sans-serif;max-width:800px;margin:50px auto;padding:0 24px;color:#233047;background:#f6f7f9}main{background:white;border:1px solid #e1e5eb;border-radius:20px;padding:32px}h1{font-size:30px}pre{padding:16px;background:#edf1f6;border-radius:12px;white-space:pre-wrap}a{color:#006edb}</style><main><h1>PPT 自动生成器</h1><p>Python、python-pptx 与 Pillow 生成 16 页可编辑演示模板。保留原有模板，并提供不读取私人图片的 DEMO 模式。</p><pre>python build_ppt.py --demo --output demo.pptx</pre><p>可配置素材、已脱敏截图、配图、工作目录、输出文件与字体。素材缺失时先预检并提示，不会宣称构建成功。</p><p><a href="usage.html">查看运行参数与素材说明 →</a></p><p>输出是原生 PPTX，可在 PowerPoint、WPS、Keynote 中继续编辑。私人原始素材未随仓库分发。</p></main></html>
